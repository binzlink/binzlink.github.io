type: "skill"
name: "Skill Creator"
featured: false
job:
  en: "Write or improve a Claude skill"
  zh: "编写或改进一条 Claude skill"
description:
  en: |
    Meta skill for creating, evaluating, and improving other skills. Bundled in `example-skills` from anthropics/skills.
  zh: "用来创建、评估和改进其他 skill 的元 skill。 包含在 anthropics/skills 的 `example-skills` 插件包里。"
install:
  claude_code: |
    /plugin marketplace add anthropics/skills
    /plugin install example-skills@anthropic-agent-skills
status: "unverified"
risk:
  needs_token: false
  stdio: false
  can_write_files: true
  notes:
    en: |
      Skills are markdown plus optional scripts. They can instruct Claude to write files. Review SKILL.md before use.
    zh: "Skill 是 markdown 加可选脚本，会指示 Claude 写文件。用前先读 SKILL.md。"
source:
  github: "https://github.com/anthropics/skills/tree/main/skills/skill-creator"
  marketplace: "anthropic-agent-skills"
  homepage: "https://github.com/anthropics/skills"
source_checked_at: "2026-08-13"
