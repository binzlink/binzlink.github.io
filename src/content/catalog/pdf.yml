type: "skill"
name: "PDF"
featured: false
job:
  en: "Extract, fill, and create PDF files"
  zh: "抽取、填写和生成 PDF"
description:
  en: |
    Document skill used by Claude for PDF read/write workflows. Bundled in `document-skills` from anthropics/skills.
  zh: "Claude 文档能力用的 PDF skill，覆盖读写工作流。 包含在 anthropics/skills 的 `document-skills` 插件包里。"
install:
  claude_code: |
    /plugin marketplace add anthropics/skills
    /plugin install document-skills@anthropic-agent-skills
status: "unverified"
risk:
  needs_token: false
  stdio: false
  can_write_files: true
  notes:
    en: |
      Skills are markdown plus optional scripts. They can instruct Claude to write files. Review SKILL.md before use.
    zh: "Skill 是 markdown 加可选脚本，会指示 Claude 写文件。用前先读 SKILL.md。"
source:
