<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI China vs US - Global AI Tools Showdown</title>
  <meta name="description" content="China AI vs USA AI — The ultimate showdown of the world's top AI tools and platforms">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <style>
    :root {
      --bg-primary: #0a0a12;
      --bg-secondary: #12121e;
      --text-primary: #e8e8f0;
      --text-secondary: #8a8aa0;
      --border: rgba(255,255,255,0.06);
      --cn-primary: #ff4757;
      --cn-light: #ff6b81;
      --cn-glow: rgba(255, 71, 87, 0.2);
      --cn-bg: rgba(255, 71, 87, 0.06);
      --cn-card: #1a1018;
      --cn-card-hover: #221420;
      --cn-border: rgba(255, 71, 87, 0.12);
      --us-primary: #3b82f6;
      --us-light: #60a5fa;
      --us-glow: rgba(59, 130, 246, 0.2);
      --us-bg: rgba(59, 130, 246, 0.06);
      --us-card: #0e1525;
      --us-card-hover: #121c30;
      --us-border: rgba(59, 130, 246, 0.12);
      --vs-gold: #fbbf24;
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 15% 50%, var(--cn-bg) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 50%, var(--us-bg) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 0%, rgba(251,191,36,0.04) 0%, transparent 40%);
      z-index: -1;
    }

    /* Language Switcher */
    .lang-switch {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 200;
      display: flex;
      border-radius: 50px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(10,10,18,0.85);
      backdrop-filter: blur(12px);
    }
    .lang-btn {
      padding: 7px 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .lang-btn:hover { color: var(--text-primary); }
    .lang-btn.active {
      background: var(--vs-gold);
      color: #000;
    }

    /* Header */
    .header { text-align: center; padding: 50px 20px 20px; }
    .header-title {
      font-size: 3rem; font-weight: 900; letter-spacing: 2px;
      margin-bottom: 8px; display: flex; align-items: center;
      justify-content: center; gap: 16px; flex-wrap: wrap;
    }
    .header-title .cn-text {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-title .vs-text {
      font-size: 2rem; color: var(--vs-gold); -webkit-text-fill-color: var(--vs-gold);
      text-shadow: 0 0 30px rgba(251,191,36,0.4);
      animation: vsPulse 2s ease-in-out infinite; font-style: italic;
    }
    .header-title .us-text {
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    @keyframes vsPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    .header-sub { color: var(--text-secondary); font-size: 1rem; margin-bottom: 24px; }

    /* Scoreboard */
    .scoreboard { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 24px; }
    .score-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .score-flag { font-size: 2rem; }
    .score-num { font-size: 2.2rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .score-num.cn { color: var(--cn-primary); }
    .score-num.us { color: var(--us-primary); }
    .score-label { font-size: 0.78rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
    .score-vs { font-size: 1.2rem; font-weight: 800; color: var(--vs-gold); font-style: italic; }

    /* Search */
    .search-wrapper { max-width: 520px; margin: 0 auto 16px; padding: 0 20px; position: relative; }
    .search-box {
      width: 100%; padding: 14px 20px 14px 48px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 50px; color: var(--text-primary); font-size: 0.95rem;
      outline: none; transition: all 0.3s ease;
    }
    .search-box:focus { border-color: var(--vs-gold); box-shadow: 0 0 0 3px rgba(251,191,36,0.15); }
    .search-box::placeholder { color: var(--text-secondary); }
    .search-icon { position: absolute; left: 36px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }

    /* Filter */
    .filter-bar { max-width: 900px; margin: 0 auto 10px; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .filter-btn {
      padding: 6px 16px; border: 1px solid var(--border); border-radius: 50px;
      background: transparent; color: var(--text-secondary); font-size: 0.82rem;
      cursor: pointer; transition: all 0.25s ease; white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--vs-gold); color: var(--vs-gold); }
    .filter-btn.active { background: var(--vs-gold); color: #000; border-color: var(--vs-gold); font-weight: 600; }

    /* Arena */
    .arena { display: flex; gap: 0; max-width: 1440px; margin: 0 auto; padding: 0 12px 60px; position: relative; }
    .vs-divider {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 3px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, transparent 0%, var(--vs-gold) 5%, var(--vs-gold) 95%, transparent 100%);
      opacity: 0.3; z-index: 2;
    }
    .vs-divider::before {
      content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 40px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, transparent 0%, rgba(251,191,36,0.06) 10%, rgba(251,191,36,0.06) 90%, transparent 100%);
      filter: blur(10px);
    }
    .side { flex: 1; min-width: 0; padding: 20px 8px; }
    .side.cn { padding-right: 28px; }
    .side.us { padding-left: 28px; }

    /* Side header */
    .side-header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; padding-bottom: 12px; }
    .side.cn .side-header { border-bottom: 2px solid var(--cn-border); }
    .side.us .side-header { border-bottom: 2px solid var(--us-border); }
    .side-flag { font-size: 1.6rem; }
    .side-name { font-size: 1.3rem; font-weight: 800; letter-spacing: 1px; }
    .side.cn .side-name { color: var(--cn-primary); }
    .side.us .side-name { color: var(--us-primary); }
    .side-count { font-size: 0.75rem; padding: 2px 10px; border-radius: 50px; font-weight: 600; }
    .side.cn .side-count { background: var(--cn-bg); color: var(--cn-light); }
    .side.us .side-count { background: var(--us-bg); color: var(--us-light); }

    /* Category */
    .cat-block { margin-bottom: 32px; }
    .cat-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
    .cat-title .icon { font-size: 1.1rem; }
    .cat-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 50px; font-weight: 500; }
    .side.cn .cat-badge { background: var(--cn-bg); color: var(--cn-light); }
    .side.us .cat-badge { background: var(--us-bg); color: var(--us-light); }

    /* Cards */
    .card-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .card {
      border-radius: var(--radius); padding: 16px; transition: all 0.3s ease;
      cursor: pointer; text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 8px;
      position: relative; overflow: hidden; border: 1px solid transparent;
    }
    .side.cn .card { background: var(--cn-card); border-color: var(--cn-border); }
    .side.us .card { background: var(--us-card); border-color: var(--us-border); }
    .side.cn .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--cn-primary), var(--cn-light)); opacity: 0; transition: opacity 0.3s; }
    .side.us .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--us-primary), var(--us-light)); opacity: 0; transition: opacity 0.3s; }
    .side.cn .card:hover { transform: translateY(-3px); border-color: rgba(255,71,87,0.3); box-shadow: 0 4px 20px var(--cn-glow); background: var(--cn-card-hover); }
    .side.us .card:hover { transform: translateY(-3px); border-color: rgba(59,130,246,0.3); box-shadow: 0 4px 20px var(--us-glow); background: var(--us-card-hover); }
    .card:hover::before { opacity: 1; }
    .card-header { display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; }
    .side.cn .card-icon { background: rgba(255,71,87,0.1); }
    .side.us .card-icon { background: rgba(59,130,246,0.1); }
    .card-name { font-size: 0.95rem; font-weight: 600; }
    .card-desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
    .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 50px; }
    .tag.default { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
    .tag.free { background: rgba(52,211,153,0.12); color: #34d399; }
    .tag.hot { background: rgba(251,146,60,0.12); color: #fb923c; }

    /* No results */
    .no-results { text-align: center; padding: 60px 20px; color: var(--text-secondary); display: none; }
    .no-results.show { display: block; }
    .no-results .emoji { font-size: 3rem; margin-bottom: 16px; }

    /* Back to top */
    .back-top {
      position: fixed; bottom: 30px; right: 30px; width: 44px; height: 44px;
      border-radius: 50%; background: var(--vs-gold); color: #000; border: none;
      cursor: pointer; font-size: 1.2rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: translateY(20px); transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(251,191,36,0.3); z-index: 100;
    }
    .back-top.show { opacity: 1; transform: translateY(0); }
    .back-top:hover { transform: translateY(-3px); }

    /* Footer */
    .footer { text-align: center; padding: 30px 20px; color: var(--text-secondary); font-size: 0.82rem; border-top: 1px solid var(--border); }

    /* Responsive */
    @media (max-width: 860px) {
      .header-title { font-size: 2rem; gap: 10px; }
      .header-title .vs-text { font-size: 1.4rem; }
      .arena { flex-direction: column; padding: 0 16px 60px; }
      .side.cn, .side.us { padding: 16px 0; }
      .vs-divider { display: none; }
      .scoreboard { gap: 16px; }
      .score-num { font-size: 1.6rem; }
      .lang-switch { top: 10px; right: 12px; }
      .lang-btn { padding: 5px 12px; font-size: 0.78rem; }
    }

    .card { animation: fadeSlide 0.35s ease both; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Language Switcher -->

function t(key) { return I18N[currentLang][key] || key; }
function tTag(tag) { return (I18N[currentLang].tags || {})[tag] || tag; }
function tCat(key) { return (I18N[currentLang].cats || {})[key] || key; }

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('ai-nav-lang', lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  applyI18n();
  buildFilters();
  render(getActiveFilter(), searchInput.value);
}

function applyI18n() {
  document.getElementById('titleCN').textContent = t('titleCN');
  document.getElementById('titleUS').textContent = t('titleUS');
  document.getElementById('headerSub').textContent = t('headerSub');
  document.getElementById('labelCN').textContent = t('labelCN');
  document.getElementById('labelUS').textContent = t('labelUS');
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');
  document.getElementById('noResultsText').textContent = t('noResults');
  document.getElementById('footerText').textContent = t('footer');
  document.title = currentLang === 'zh'
    ? 'AI 中美对决 - 全球AI工具对抗导航'

}

const cnSide = document.getElementById('cnSide');
const usSide = document.getElementById('usSide');
const filterBar = document.getElementById('filterBar');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
const cnCountEl = document.getElementById('cnCount');
const usCountEl = document.getElementById('usCount');
const backTop = document.getElementById('backTop');

function getActiveFilter() {
  const active = document.querySelector('.filter-btn.active');
  return active ? active.dataset.key : 'all';
}

function renderTags(tags) {
  return tags.map(tag => {
    let cls = 'tag';
    const translated = tTag(tag);
    if (tag === '免费' || tag === '免费试用') cls += ' free';
    else if (tag === '热门') cls += ' hot';
    else cls += ' default';
    return `<span class="${cls}">${translated}</span>`;
  }).join('');
}

function getItemName(item) {
  if (currentLang === 'en' && item.nameEn) return item.nameEn;
  return item.name;
}

function getItemDesc(item) {
  if (currentLang === 'en' && item.descEn) return item.descEn;
  return item.desc;
}

function renderCard(item) {
  return `
    <a class="card" href="${item.url}" target="_blank" rel="noopener noreferrer">
      <div class="card-header">
        <div class="card-icon">${item.icon}</div>
        <div class="card-name">${getItemName(item)}</div>
      </div>
      <div class="card-desc">${getItemDesc(item)}</div>
      <div class="card-tags">${renderTags(item.tags)}</div>
    </a>
  `;
}

function renderSideHTML(catsData, sideClass, flag, label) {
  let count = 0;
  let html = '';
  catsData.forEach(cat => {
    if (cat.items.length === 0) return;
    count += cat.items.length;
    html += `
      <div class="cat-block">
        <div class="cat-title">
          <span class="icon">${cat.icon}</span>
          ${cat.catName}
          <span class="cat-badge">${cat.items.length}</span>
        </div>
        <div class="card-grid">
          ${cat.items.map(item => renderCard(item)).join('')}
        </div>
      </div>
    `;
  });
  return {
    header: `
      <div class="side-header">
        <span class="side-flag">${flag}</span>
        <span class="side-name">${label}</span>
        <span class="side-count">${count} ${t('toolUnit')}</span>
      </div>
    `,
    body: html,
    count
  };
}

function buildFilters() {
  filterBar.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn' + (getActiveFilter() === 'all' ? ' active' : '');
  allBtn.textContent = t('filterAll');
  allBtn.dataset.key = 'all';
  filterBar.appendChild(allBtn);

  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    const isActive = getActiveFilter() === cat.key;
    btn.className = 'filter-btn' + (isActive ? ' active' : '');
    btn.textContent = cat.icon + ' ' + tCat(cat.key);
    btn.dataset.key = cat.key;
    filterBar.appendChild(btn);
  });
}

function render(filterKey = 'all', query = '') {
  const q = query.toLowerCase().trim();

  const filtered = CATEGORIES.map(cat => {
    if (filterKey !== 'all' && cat.key !== filterKey) return { ...cat, cn: [], us: [] };
    const filterItems = items => items.filter(item => {
      if (!q) return true;
      const searchable = [item.name, item.nameEn || '', item.desc, item.descEn || '', ...item.tags, tCat(cat.key)].join(' ').toLowerCase();
      return searchable.includes(q);
    });
    return { ...cat, cn: filterItems(cat.cn), us: filterItems(cat.us) };
  });

  const cnLabel = currentLang === 'zh' ? '中国 AI' : 'China AI';
  const usLabel = currentLang === 'zh' ? '美国 AI' : 'US AI';

  const cnData = filtered.map(c => ({ catName: tCat(c.key), icon: c.icon, items: c.cn }));
  const usData = filtered.map(c => ({ catName: tCat(c.key), icon: c.icon, items: c.us }));

  const cnResult = renderSideHTML(cnData, 'cn', '🇨🇳', cnLabel);
  const usResult = renderSideHTML(usData, 'us', '🇺🇸', usLabel);

  cnSide.innerHTML = cnResult.header + cnResult.body;
  usSide.innerHTML = usResult.header + usResult.body;

  cnCountEl.textContent = cnResult.count;
  usCountEl.textContent = usResult.count;

  const total = cnResult.count + usResult.count;
  noResults.classList.toggle('show', total === 0);
  document.getElementById('arena').style.display = total === 0 ? 'none' : 'flex';
}

// ==================== Events ====================
filterBar.addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  render(e.target.dataset.key, searchInput.value);
});

let debounce;
searchInput.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    render(getActiveFilter(), searchInput.value);
  }, 200);
});

window.addEventListener('scroll', () => {
  backTop.classList.toggle('show', window.scrollY > 400);
});

// ==================== Init ====================
setLang(currentLang);
</script>
</body>
</html>
